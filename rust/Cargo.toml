[package]
name = "chaincraft-core"
version = "1.0.0"
edition = "2021"
rust-version = "1.74"
license = "MIT"
description = "Chaincraft Level 0 wire protocol and Level 1 object semantics"
publish = false

[lib]
name = "chaincraft_core"
path = "src/lib.rs"

[[bin]]
name = "features"
path = "src/bin/features.rs"

[dependencies]
ed25519-dalek = "2.1"
hex = "0.4"
indexmap = "2"
k256 = { version = "0.13", features = ["schnorr"] }
sha2 = "0.10"
thiserror = "2"

[dev-dependencies]
serde_json = "1"
