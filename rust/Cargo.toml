[package]
name = "chaincraft"
version = "1.0.0"
edition = "2021"
rust-version = "1.74"
authors = ["Chaincraft Contributors"]
license = "MIT"
description = "Chaincraft Level 0 wire protocol and Level 1 object semantics"
readme = "README.md"
homepage = "https://github.com/jose-compu/chaincraft-monorepo"
repository = "https://github.com/jose-compu/chaincraft-monorepo"
documentation = "https://docs.rs/chaincraft"
keywords = ["blockchain", "education", "prototyping", "distributed", "consensus"]
categories = ["network-programming", "cryptography", "science"]

[lib]
name = "chaincraft"
path = "src/lib.rs"

[[bin]]
name = "features"
path = "src/bin/features.rs"

[[bin]]
name = "node"
path = "src/bin/node.rs"

[[bin]]
name = "bt_node"
path = "src/bin/bt_node.rs"

[dependencies]
ed25519-dalek = "2.1"
hex = "0.4"
indexmap = "2"
k256 = { version = "0.13", features = ["ecdsa", "schnorr"] }
num-bigint = "0.4"
num-traits = "0.2"
serde_json = "1"
sha2 = "0.10"
thiserror = "2"

[dev-dependencies]
serde_json = "1"
