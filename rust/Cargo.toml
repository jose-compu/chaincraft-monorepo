[package]
name = "chaincraft"
version = "1.12.0"
edition = "2021"
rust-version = "1.74"
authors = ["Chaincraft Contributors"]
license = "MIT"
description = "A platform for decentralized protocols — wire, objects, and pedagogical consensus"
readme = "README.md"
homepage = "https://github.com/jose-compu/chaincraft-monorepo"
repository = "https://github.com/jose-compu/chaincraft-monorepo"
documentation = "https://docs.rs/chaincraft"
keywords = ["blockchain", "education", "prototyping", "distributed", "consensus"]
categories = ["network-programming", "cryptography", "science"]
include = [
    "src/**/*",
    "Cargo.toml",
    "Cargo.lock",
    "README.md",
    "LICENSE",
]

[lib]
name = "chaincraft"
path = "src/lib.rs"

[[bin]]
name = "chaincraft-features"
path = "src/bin/features.rs"

[[bin]]
name = "chaincraft-node"
path = "src/bin/node.rs"

[[bin]]
name = "chaincraft-bt-node"
path = "src/bin/bt_node.rs"

[dependencies]
ed25519-dalek = "2.1"
hex = "0.4"
indexmap = "2"
k256 = { version = "0.13", features = ["ecdsa", "schnorr"] }
num-bigint = "0.4"
num-traits = "0.2"
serde_json = "1"
sha2 = "0.10"
thiserror = "2"

[dev-dependencies]
serde_json = "1"
