[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "chaincraft-core"
version = "1.0.0"
description = "Chaincraft Level 0 wire protocol — reference implementation"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
keywords = ["chaincraft", "gossip", "p2p", "protocol", "interop"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: System :: Distributed Computing",
]
dependencies = []

[project.optional-dependencies]
ed25519 = ["cryptography>=42.0"]
dev = ["pytest>=7.0", "cryptography>=42.0"]

[tool.setuptools.packages.find]
where = ["."]
include = ["chaincraft_core*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "tests"]
addopts = ["--import-mode=importlib"]
