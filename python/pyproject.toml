[build-system]
requires = ["setuptools>=77.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "chaincraft"
version = "1.1.0"
description = "A platform for decentralized protocols — wire, objects, and pedagogical consensus"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Chaincraft Contributors" }
]
requires-python = ">=3.9"
keywords = ["blockchain", "education", "prototyping", "distributed", "consensus", "chaincraft", "gossip", "p2p"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Education",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Education",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: System :: Distributed Computing",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/jose-compu/chaincraft-monorepo"
Repository = "https://github.com/jose-compu/chaincraft-monorepo"
Documentation = "https://github.com/jose-compu/chaincraft-monorepo#readme"

[project.scripts]
chaincraft-py-node = "chaincraft.node:main"
chaincraft-py-bt-node = "chaincraft.bt_node:main"

[project.optional-dependencies]
ed25519 = ["cryptography>=42.0"]
dev = ["pytest>=7.0", "cryptography>=42.0"]

[tool.setuptools.packages.find]
where = ["."]
include = ["chaincraft*"]

[tool.setuptools.package-data]
chaincraft = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "tests"]
addopts = ["--import-mode=importlib"]
