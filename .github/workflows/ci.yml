name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# paths-filter lists changed files through the pulls API. The default
# token can read contents and still be refused that call.
permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Path filters keep language suites off unrelated pull requests. The parity
  # gate below deliberately ignores them.
  changes:
    name: detect changes
    runs-on: ubuntu-latest
    outputs:
      python: ${{ steps.filter.outputs.python }}
      rust: ${{ steps.filter.outputs.rust }}
      typescript: ${{ steps.filter.outputs.typescript }}
      spec: ${{ steps.filter.outputs.spec }}
      vectors: ${{ steps.filter.outputs.vectors }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            python:
              - 'python/**'
              - 'conformance/**'
              - 'SPEC/**'
            rust:
              - 'rust/**'
              - 'conformance/**'
              - 'SPEC/**'
            typescript:
              - 'typescript/**'
              - 'conformance/**'
              - 'SPEC/**'
            spec:
              - 'SPEC/**'
            vectors:
              - 'conformance/vectors/**'

  parity:
    name: parity gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install toolchains for feature manifests
        run: pip install pyyaml
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Install TypeScript dependencies
        if: hashFiles('typescript/package.json') != ''
        working-directory: typescript
        run: npm ci || npm install
      - name: Run parity gate
        run: python3 tools/parity_check.py
      - name: Parity summary
        if: always()
        run: python3 tools/parity_check.py --summary >> "$GITHUB_STEP_SUMMARY"

  vectors:
    name: vectors are reproducible
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Regenerate vectors
        run: python3 conformance/generate_vectors.py
      - name: Fail on drift
        run: |
          if ! git diff --quiet -- conformance/vectors/; then
            echo "::error::Committed vectors do not match the generator output."
            echo "Regenerate with: python3 conformance/generate_vectors.py"
            git diff -- conformance/vectors/
            exit 1
          fi
          echo "Vectors match the generator."

  # A changed vector file means the wire protocol changed. Surface it loudly so
  # a reviewer has to make a decision rather than scrolling past it.
  vector-change-notice:
    name: wire protocol change notice
    needs: changes
    if: needs.changes.outputs.vectors == 'true' && github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - run: |
          {
            echo "## Wire protocol change detected"
            echo
            echo "This pull request modifies \`conformance/vectors/\`, which means the"
            echo "wire protocol changed. Before merging, confirm:"
            echo
            echo "- [ ] The pull request description explains the change"
            echo "- [ ] \`SPEC/wire-v1.md\` is updated"
            echo "- [ ] The protocol version was bumped, or the change is provably compatible"
            echo "- [ ] All three implementations land in this same pull request"
            echo
            echo "See AGENTS.md section 7."
          } >> "$GITHUB_STEP_SUMMARY"

  python:
    name: python (${{ matrix.python-version }})
    needs: changes
    if: needs.changes.outputs.python == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.9', '3.11', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        working-directory: python
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Test
        working-directory: python
        run: python -m pytest tests/ -v

  rust:
    name: rust
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Skip if the crate does not exist yet
        id: exists
        run: |
          if [ -f rust/Cargo.toml ]; then
            echo "found=true" >> "$GITHUB_OUTPUT"
          else
            echo "found=false" >> "$GITHUB_OUTPUT"
            echo "rust/ has no Cargo.toml yet — Stage 5 not started."
          fi
      - uses: dtolnay/rust-toolchain@stable
        if: steps.exists.outputs.found == 'true'
        with:
          components: rustfmt, clippy
      - name: Format
        if: steps.exists.outputs.found == 'true'
        working-directory: rust
        run: cargo fmt --check
      - name: Clippy
        if: steps.exists.outputs.found == 'true'
        working-directory: rust
        run: cargo clippy --all-targets --all-features -- -D warnings
      - name: Test
        if: steps.exists.outputs.found == 'true'
        working-directory: rust
        run: cargo test --all-features --verbose

  typescript:
    name: typescript (node ${{ matrix.node-version }})
    needs: changes
    if: needs.changes.outputs.typescript == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The suite runs the TypeScript sources directly through Node's type
        # stripping, which needs 22.6+. The published artifact targets ES2022
        # and is checked separately by the typescript-dist job below.
        node-version: ['22', '24']
    steps:
      - uses: actions/checkout@v4
      - name: Skip if the package does not exist yet
        id: exists
        run: |
          if [ -f typescript/package.json ]; then
            echo "found=true" >> "$GITHUB_OUTPUT"
          else
            echo "found=false" >> "$GITHUB_OUTPUT"
            echo "typescript/ has no package.json yet — Stage 4 not started."
          fi
      - uses: actions/setup-node@v4
        if: steps.exists.outputs.found == 'true'
        with:
          node-version: ${{ matrix.node-version }}
      - name: Install
        if: steps.exists.outputs.found == 'true'
        working-directory: typescript
        run: npm ci || npm install
      - name: Typecheck
        if: steps.exists.outputs.found == 'true'
        working-directory: typescript
        run: npm run lint --if-present
      - name: Test
        if: steps.exists.outputs.found == 'true'
        working-directory: typescript
        run: npm test

  # Proves the compiled output actually runs on the oldest supported runtime,
  # rather than assuming it from the compiler target.
  typescript-dist:
    name: typescript build runs on node 20
    needs: changes
    if: needs.changes.outputs.typescript == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Skip if the package does not exist yet
        id: exists
        run: |
          if [ -f typescript/package.json ]; then
            echo "found=true" >> "$GITHUB_OUTPUT"
          else
            echo "found=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-node@v4
        if: steps.exists.outputs.found == 'true'
        with:
          node-version: '22'
      - name: Build
        if: steps.exists.outputs.found == 'true'
        working-directory: typescript
        run: |
          npm ci || npm install
          npm run build
      - uses: actions/setup-node@v4
        if: steps.exists.outputs.found == 'true'
        with:
          node-version: '20'
      - name: Smoke test the compiled output
        if: steps.exists.outputs.found == 'true'
        working-directory: typescript
        run: |
          node --input-type=module -e "
            import { canonicalJson, payloadDigest } from './dist/index.js';
            const digest = payloadDigest({});
            if (canonicalJson({ b: 1, a: 2 }) !== '{\"a\":2,\"b\":1}') throw new Error('canonical');
            if (digest !== '44136fa355b3678a1146ad16f7e8649e94fb4fc21fe77e8310c060f61caaff8a') {
              throw new Error('digest');
            }
            console.log('compiled output runs on node ' + process.version);
          "

  interop:
    name: live interop matrix
    needs: [python, rust, typescript]
    if: always() && !cancelled()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check all three implementations exist
        id: ready
        run: |
          if [ -f python/pyproject.toml ] && [ -f rust/Cargo.toml ] && [ -f typescript/package.json ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "Not all implementations exist yet — Stage 6 not reachable."
          fi
      - uses: dtolnay/rust-toolchain@stable
        if: steps.ready.outputs.ready == 'true'
      - uses: actions/setup-node@v4
        if: steps.ready.outputs.ready == 'true'
        with:
          node-version: '22'
      - name: Install Python node
        if: steps.ready.outputs.ready == 'true'
        working-directory: python
        run: pip install -e .
      - name: Install TypeScript node
        if: steps.ready.outputs.ready == 'true'
        working-directory: typescript
        run: npm ci || npm install
      - name: Build Rust node
        if: steps.ready.outputs.ready == 'true'
        working-directory: rust
        run: cargo build --bin node
      - name: Run the 3x3 matrix
        if: steps.ready.outputs.ready == 'true'
        run: python3 conformance/runner/run_interop.py

  bittorrent:
    name: mixed bittorrent swarm
    needs: [python, rust, typescript]
    if: always() && !cancelled()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Python node
        working-directory: python
        run: pip install -e .
      - name: Install TypeScript node
        working-directory: typescript
        run: npm ci || npm install
      - name: Build Rust node
        working-directory: rust
        run: cargo build --bin node --bin bt_node
      - name: Run the 3-client swarm
        run: python3 conformance/runner/run_bittorrent.py

  ci:
    name: CI
    runs-on: ubuntu-latest
    needs: [parity, vectors, python, rust, typescript, interop, bittorrent]
    if: always()
    steps:
      - name: Fail if any required job failed
        run: |
          results='${{ toJSON(needs) }}'
          echo "$results"
          if echo "$results" | grep -q '"result": "failure"'; then
            echo "::error::One or more jobs failed."
            exit 1
          fi
          echo "All jobs passed or were skipped."
