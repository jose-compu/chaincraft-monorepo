name: Publish

on:
  push:
    tags:
      - "v[0-9]*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  crates:
    name: crates.io (chaincraft)
    if: ${{ github.event_name == 'workflow_dispatch' || (!contains(github.ref_name, '-python') && !contains(github.ref_name, '-typescript')) }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: rust
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Check tag matches crate version
        if: github.event_name != 'workflow_dispatch'
        run: |
          set -euxo pipefail
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          TAG_VERSION="${TAG_VERSION%%-*}"
          CARGO_VERSION="$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[] | select(.name=="chaincraft") | .version')"
          echo "tag=${TAG_VERSION} crate=${CARGO_VERSION}"
          test "$TAG_VERSION" = "$CARGO_VERSION"
      - name: Test
        run: cargo test --all-features --verbose
      - name: Publish to crates.io
        run: cargo publish --locked
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

  pypi:
    name: PyPI (chaincraft)
    if: ${{ github.event_name == 'workflow_dispatch' || (!contains(github.ref_name, '-rust') && !contains(github.ref_name, '-typescript')) }}
    runs-on: ubuntu-latest
    environment: release
    permissions:
      id-token: write
      contents: read
    defaults:
      run:
        working-directory: python
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check tag matches package version
        if: github.event_name != 'workflow_dispatch'
        run: |
          set -euxo pipefail
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          TAG_VERSION="${TAG_VERSION%%-*}"
          PKG_VERSION="$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml","rb"))["project"]["version"])')"
          echo "tag=${TAG_VERSION} package=${PKG_VERSION}"
          test "$TAG_VERSION" = "$PKG_VERSION"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]" build
      - name: Test
        run: python -m pytest tests/ -v
      - name: Build
        run: python -m build
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: python/dist/
          skip-existing: true
          verbose: true

  npm:
    name: npm (@chaincraft/core)
    if: ${{ github.event_name == 'workflow_dispatch' || (!contains(github.ref_name, '-python') && !contains(github.ref_name, '-rust')) }}
    runs-on: ubuntu-latest
    environment: release
    permissions:
      id-token: write
      contents: read
    defaults:
      run:
        working-directory: typescript
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"
      - name: Upgrade npm for trusted publishing
        run: npm install -g 'npm@^11.5.1'
      - name: Check tag matches package version
        if: github.event_name != 'workflow_dispatch'
        run: |
          set -euxo pipefail
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          TAG_VERSION="${TAG_VERSION%%-*}"
          PKG_VERSION="$(node -p "require('./package.json').version")"
          echo "tag=${TAG_VERSION} package=${PKG_VERSION}"
          test "$TAG_VERSION" = "$PKG_VERSION"
      - name: Install
        run: npm ci --ignore-scripts
      - name: Test
        run: npm test
      - name: Build
        run: npm run build
      - name: Publish to npm
        run: npm publish --access public --provenance
