  - id: wire.framing-udp
    level: 0
    spec: SPEC/wire-v1.md#4.2
    summary: One envelope per datagram, 65507 byte cap
    vectors: conformance/vectors/framing.json
    status:
      python:     { state: implemented, since: "2026-09-09" }
      rust:       { state: implemented, since: "2026-09-09" }
      typescript:
        state: exempt
        reason: >-
          Raw UDP sockets are unavailable in browsers, and the Node-only subset
          would not be the same capability. UDP is optional at Level 0 and is
          advertised through ctl.hello, so a TypeScript node interoperates fully
          over TCP without it.
        reviewed_by: null

