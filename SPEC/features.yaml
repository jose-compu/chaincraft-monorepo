# Chaincraft parity registry
#
# The single record of what exists in which language. Enforced by
# tools/parity_check.py on every pull request. See AGENTS.md section 5.
#
# Entry schema:
#   id        Stable feature identifier, dot-namespaced. Never renamed.
#   level     0 wire | 1 semantics | 2 features
#   spec      Path plus anchor into SPEC/
#   summary   One line, observable behaviour
#   vectors   Path under conformance/vectors/, or null for doc-only entries.
#             Required once a feature is implemented somewhere, not before.
#   backfill  true for surface predating the parity commitment; exempt from the
#             14-day clock, requires `milestone` instead (ROADMAP.md 5, Stage 8)
#   legacy    Where an existing implementation can be ported from. Present only
#             on backfill entries. It is a porting hint, never a parity claim:
#             a feature counts as implemented only when it lives in this
#             monorepo and the language manifest reports it.
#   milestone Deadline for backfill entries, replacing the grace period
#   status    Per language: state, since, and issue or reason
#
# States: implemented | in-progress | planned | exempt
#   in-progress  requires `issue`
#   exempt       requires `reason` and a human reviewer

# Registry schema version. The spec release the packages implement is
# SPEC/release.yaml, not this number.
version: 1
grace_period_days: 14

languages:
  - python
  - rust
  - typescript

# Languages with no source tree yet. The gate reports their gaps but does not
# fail on them. Each entry is removed when that implementation lands, which is
# what makes the gate go live for it.
bootstrap: {}

