# Spec release tracked against the three packages.
#
# `release` is the specification the implementations ship.
# `wire_protocol` is the envelope `v` field. It does not move when the
# spec release moves.
#
# tools/parity_check.py fails unless:
#   - this release equals python/pyproject.toml, rust/Cargo.toml,
#     typescript/package.json, and the in-code version constants
#   - wire_protocol equals the in-code wire version constants
#   - every markdown file under SPEC/ is listed here
#   - every listed file contains **Release:** <release>

